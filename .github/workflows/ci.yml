name: Cargo Build & Test

# Deux dossiers, deux mondes : la CI ne lance que ce qui est concerné.
#   - un commit qui ne touche ni `backend/`, ni `frontend/`, ni `scripts/`, ni
#     `docker/` (README, modèles…) ne déclenche **aucun** job ;
#   - un changement purement frontend n'exécute pas la matrice Rust (job
#     `changes` + `if:` sur chaque job), et inversement ; `docker/` n'exécute que
#     l'auto-test du fournisseur fictif.
# Les workflows font partie des filtres : modifier la CI la relance.
#
# `branches: [master]` : sans ce filtre, pousser un tag relançait toute la CI
# (les releases ont leur propre workflow, `release.yml`).
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

env: 
  CARGO_TERM_COLOR: always

# Le crate Rust vit dans backend/ depuis la restructuration monorepo.
defaults:
  run:
    working-directory: backend

jobs:
  # Y a-t-il du backend à vérifier ? du frontend à tester ?
  changes:
    name: Fichiers modifiés
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docker: ${{ steps.filter.outputs.docker }}
      sso: ${{ steps.filter.outputs.sso }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Comparer au commit précédent, pas seulement au dernier commit.
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            scripts:
              - 'scripts/**'
            docker:
              - 'docker/**'
              - 'docker-compose.yml'
              - 'Dockerfile'
              - '.github/workflows/**'
            # Le royaume Keycloak est vérifié à part : tirer l'image (~500 Mo)
            # à chaque changement de `docker/` (scripts k6, fournisseur fictif)
            # coûterait cher pour rien.
            sso:
              - 'docker/keycloak/**'
              - 'backend/src/auth/oidc.rs'
              - '.github/workflows/**'

  build_and_test:
    name: Rust project - latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v6
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo build --verbose
      - run: cargo test --verbose

  latest_deps:
    name: Latest Dependencies
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable
      - run: cargo update --verbose
      - run: cargo build --verbose
      - run: cargo test --verbose

  msrv:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: taiki-e/install-action@cargo-hack
    - run: cargo hack check --rust-version --workspace --all-targets --ignore-private

  warnings:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --all-features --keep-going

  # Vulnérabilités **publiées** dans les dépendances (base RustSec). Ce n'est pas
  # un doublon de Dependabot : celui-ci propose des mises à jour, celui-là dit
  # « la version que tu as est vulnérable » — et il le dit même quand aucune
  # version corrigée n'existe encore.
  #
  # Pas de `continue-on-error` à dessein : un avis RustSec fait échouer le job,
  # donc le run. Une alerte qu'on peut ignorer sans rien faire n'est jamais
  # traitée.
  audit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # `cargo-audit` (RustSec) : binaire installé à la demande ; la base d'avis
      # est téléchargée à chaque exécution (elle bouge tous les jours).
      - uses: taiki-e/install-action@cargo-audit
      # `Cargo.lock` n'est **pas** versionné dans ce dépôt : on le résout ici
      # pour auditer exactement ce que les autres jobs compilent. Le commit du
      # verrou reste une décision à part (elle figerait aussi les mises à jour
      # automatiques) ; l'audit, lui, n'attend pas.
      - run: cargo generate-lockfile
      - run: cargo audit

  # Sécurité de l'**image** (Trivy) : ce qui part chez l'utilisateur est le
  # conteneur, pas les lockfiles de développement. `bun.lock` remonte des avis
  # HIGH et CRITICAL dans `vite`, `simple-git`, `undici`, `vue-i18n`… qui ne
  # sont **jamais livrés** (l'image ne contient que `.output` et le binaire) :
  # les scanner ferait échouer chaque PR sans action possible, alors que les
  # corriger demande une montée de version majeure du frontend.
  #
  # Seuils : **CRITICAL bloque** — l'image est propre aujourd'hui (vérifié :
  # « Clean (no security findings detected) ») ; **HIGH est affiché** sans
  # bloquer, car les avis restants viennent des dépendances embarquées par
  # `npm` dans l'image Node, qu'on ne corrige qu'en changeant d'image de base.
  trivy:
    name: Trivy (image)
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    # Le crate vit dans `backend/` : ce job, lui, travaille à la racine.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # Même construction que la release, **sans publication**. Le cache GHA
      # évite de recompiler Rust et Nuxt à chaque passage (`ignore-error` : un
      # cache qu'on ne peut pas écrire, depuis un fork, ne doit pas casser le
      # job).
      - name: Construire l'image
        run: |
          docker buildx build \
            --load \
            --file Dockerfile \
            . \
            --tag easy3d:ci \
            --cache-from type=gha \
            --cache-to type=gha,mode=max,ignore-error=true
      # Trivy tourne depuis son **image officielle** (Docker Hub) plutôt que via
      # `aquasecurity/setup-trivy` : l'action télécharge l'archive de release
      # GitHub à chaque passage, et ce téléchargement échoue sur les runners
      # depuis le 2026-11-03 (`curl` sortie 6 — résolution DNS — alors que l'API
      # GitHub répond et que les images Docker Hub se tirent sans problème dans
      # le même job). Version épinglée, image tirée du registre, et aucune action
      # tierce de plus dans le workflow.
      - name: CRITICAL (bloquant)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 easy3d:ci
      - name: HIGH (rapport, non bloquant)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH --ignore-unfixed --exit-code 0 easy3d:ci

  # Tests unitaires (vitest) et build Nuxt : le build est le seul endroit qui
  # attrape une erreur de gabarit ou de SSR, invisible aux tests unitaires.
  # Les tests de bout en bout (Playwright) ne sont pas encore ici : ils attendent
  # un catalogue, alors que `models/` est vide en CI (seul `.gitkeep` est suivi).
  frontend:
    name: Frontend (bun)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      # Version de bun lue dans `packageManager` (frontend/package.json).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  # La ligne « langues » du README est calculée depuis `frontend/i18n/locales.json`
  # et les fichiers de messages : ce job la régénère, et ne committe que si elle a
  # bougé. Le commit ne porte que sur `README.md`, absent des `paths` ci-dessus,
  # donc il ne relance pas la CI.
  #
  # Sur une pull request (et a fortiori depuis un fork, où le jeton est en
  # lecture seule) le job ne tourne pas : la mise à jour se fera au merge.
  readme:
    name: README (langues)
    needs: changes
    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Le crate vit dans `backend/` : ce job, lui, travaille à la racine.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/readme-langs.mjs
      - run: |
          if git diff --quiet -- README.md; then
            echo "README déjà à jour."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: langues du README' README.md
          git push

  # Couverture **globale** (Rust + frontend) : le badge du README est calculé
  # ici, jamais saisi à la main. Même principe que le job `readme` — il ne
  # committe que si le badge a bougé, et `README.md` n'est pas dans les `paths`
  # du workflow, donc ce commit ne relance pas la CI.
  #
  # Deux chaînes d'instrumentation distinctes : `cargo llvm-cov` (tests unitaires
  # et d'intégration Rust) et `vitest --coverage` (frontend). `scripts/coverage.mjs`
  # additionne les **lignes** couvertes des deux — additionner les pourcentages
  # donnerait le même poids à ~16 000 lignes de Rust et à ~1 900 de TypeScript.
  #
  # Les e2e Playwright ne sont pas comptés (navigateur, build, autre chaîne).
  couverture:
    name: Couverture (badge)
    needs: changes
    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Le crate vit dans `backend/` : ce job, lui, travaille à la racine.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - name: Couverture Rust
        working-directory: backend
        run: |
          mkdir -p target/cov
          cargo llvm-cov --json --summary-only --output-path target/cov/backend-coverage.json
      - name: Couverture frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run test:coverage
      - run: node scripts/coverage.mjs
      - run: |
          if git diff --quiet -- README.md; then
            echo "Badge déjà à jour."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: badge de couverture' README.md
          git push

  # Le fournisseur d'identité fictif est du code, lui aussi — et c'est lui qui
  # sert à éprouver le SSO à la main comme en e2e. Son auto-test rejoue le flux
  # OIDC complet (découverte, autorisation, jeton, userinfo, refus), et il
  # démarre lui-même l'instance dont il a besoin : rien d'autre que Node.
  fake_oidc:
    name: Fournisseur OIDC fictif
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    # Le crate vit dans `backend/` : ce job, lui, travaille à la racine.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docker/fake-oidc/selftest.mjs

  # Le fournisseur d'identité **réel** (Keycloak), et son royaume.
  #
  # Ce que ce job vérifie n'est pas « Keycloak fonctionne » mais **notre**
  # `realm.json` : importé, il annonce le bon émetteur, les comptes de test
  # s'authentifient, `userinfo` porte les trois champs que lit
  # `auth::oidc::parse_identity`, un mot de passe erroné donne `invalid_grant`,
  # et un jeton révoqué donne bien un code que `refresh_refusal` reconnaît (sans
  # quoi easy3d ne verrait jamais une révocation). L'auto-test démarre lui-même
  # le conteneur : d'où Docker, et d'où le filtre `sso` (l'image pèse ~500 Mo).
  keycloak:
    name: Keycloak (royaume)
    needs: changes
    if: needs.changes.outputs.sso == 'true'
    runs-on: ubuntu-latest
    # Le crate vit dans `backend/` : ce job, lui, travaille à la racine
    # (`docker/keycloak/selftest.mjs`, chemins du dépôt).
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docker/keycloak/selftest.mjs