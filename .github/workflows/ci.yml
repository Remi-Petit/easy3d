name: Cargo Build & Test

# Deux dossiers, deux mondes : la CI ne lance que ce qui est concerné.
#   - un commit qui ne touche ni `backend/`, ni `frontend/`, ni `scripts/`
#     (README, modèles, compose…) ne déclenche **aucun** job ;
#   - un changement purement frontend n'exécute pas la matrice Rust (job
#     `changes` + `if:` sur chaque job), et inversement.
# Les workflows font partie des filtres : modifier la CI la relance.
#
# `branches: [master]` : sans ce filtre, pousser un tag relançait toute la CI
# (les releases ont leur propre workflow, `release.yml`).
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/**'

env: 
  CARGO_TERM_COLOR: always

# Le crate Rust vit dans backend/ depuis la restructuration monorepo.
defaults:
  run:
    working-directory: backend

jobs:
  # Y a-t-il du backend à vérifier ? du frontend à tester ?
  changes:
    name: Fichiers modifiés
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Comparer au commit précédent, pas seulement au dernier commit.
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            scripts:
              - 'scripts/**'

  build_and_test:
    name: Rust project - latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v6
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo build --verbose
      - run: cargo test --verbose

  latest_deps:
    name: Latest Dependencies
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable
      - run: cargo update --verbose
      - run: cargo build --verbose
      - run: cargo test --verbose

  msrv:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: taiki-e/install-action@cargo-hack
    - run: cargo hack check --rust-version --workspace --all-targets --ignore-private

  warnings:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --all-features --keep-going

  # Tests unitaires (vitest) et build Nuxt : le build est le seul endroit qui
  # attrape une erreur de gabarit ou de SSR, invisible aux tests unitaires.
  # Les tests de bout en bout (Playwright) ne sont pas encore ici : ils attendent
  # un catalogue, alors que `models/` est vide en CI (seul `.gitkeep` est suivi).
  frontend:
    name: Frontend (bun)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      # Version de bun lue dans `packageManager` (frontend/package.json).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  # La ligne « langues » du README est calculée depuis `frontend/i18n/locales.json`
  # et les fichiers de messages : ce job la régénère, et ne committe que si elle a
  # bougé. Le commit ne porte que sur `README.md`, absent des `paths` ci-dessus,
  # donc il ne relance pas la CI.
  #
  # Sur une pull request (et a fortiori depuis un fork, où le jeton est en
  # lecture seule) le job ne tourne pas : la mise à jour se fera au merge.
  readme:
    name: README (langues)
    needs: changes
    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Le crate vit dans `backend/` : ce job, lui, travaille à la racine.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/readme-langs.mjs
      - run: |
          if git diff --quiet -- README.md; then
            echo "README déjà à jour."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: langues du README' README.md
          git push