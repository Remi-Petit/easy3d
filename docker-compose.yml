# ═══════════════════════════════════════════════════════════════════════════
#  FICHIER DE **DÉVELOPPEMENT** — ne pas utiliser tel quel en production.
# ═══════════════════════════════════════════════════════════════════════════
#
# Ce que ce fichier fait, et qui n'a pas sa place sur un serveur :
#
#   - il **construit** l'image depuis les sources (`pull_policy: build`) au lieu
#     de tirer une version publiée ;
#   - il lance un fournisseur d'identité **fictif** (`fake-oidc`) qui accepte
#     n'importe quelle connexion, sans mot de passe ;
#   - il pose un mot de passe administrateur de **test** en clair
#     (`adminadmin`), et publie l'API sur 3101 ;
#   - il déclare le banc de charge k6 (profil `loadtest`, jamais lancé par `up`).
#
# Pour un déploiement, partir de `docker/docker-compose.yml` : un seul service,
# image publiée `ghcr.io/remi-petit/easy3d`, aucune dépendance de test, comptes
# et SSO à configurer soi-même.
#
# Rien ici ne doit être exposé au-delà de la machine.
# ═══════════════════════════════════════════════════════════════════════════

services:
  easy3d:
    # Image construite **localement** depuis les sources du dépôt, jamais tirée
    # d'un registre (le `Dockerfile` racine compile backend Rust + frontend Nuxt,
    # les deux tournent dans le même conteneur).
    #
    #   docker compose up --build     # recompile après une modif de code
    #
    # `pull_policy: build` rend la règle explicite : Compose construit et ne
    # cherche jamais `easy3d:dev` sur un registre.
    build:
      context: . # le Dockerfile copie backend/, frontend/ et scripts/
      dockerfile: Dockerfile
    image: easy3d:dev
    pull_policy: build
    container_name: easy3d
    restart: unless-stopped
    ports:
      - "3100:3000" # interface web : catalogue, aperçu 3D, notes
      - "3101:8090" # API HTTP + WebSocket temps réel + serveur MCP (/mcp)
    volumes:
      # Tes modèles : lus, et écrits (aperçus + notes).
      #
      # Attention : sous Docker Desktop (Windows/macOS), le partage de fichiers
      # ne remonte aucun événement inotify — ni depuis l'hôte, ni pour les
      # sous-dossiers. Le backend ne s'appuie donc pas dessus pour ses propres
      # écritures (`/upload` rediffuse lui-même, voir `post_upload`) et propose,
      # dans /admin, un re-scan périodique recommandé automatiquement quand le
      # dossier est sur un montage virtualisé ou réseau
      # (`config::watch_poll_recommendation`).
      - ./models:/models
      # Configuration : `config.yml` (écrit par /admin, clé d'API comprise) et
      # `ai-presets.yml` (les adresses connues des fournisseurs), les deux relus
      # à chaud. Un **dossier** plutôt qu'un volume nommé, justement pour pouvoir
      # les ouvrir dans un éditeur : le contenu est ignoré par git (secret ou
      # propre à la machine), et le dossier existe dans le dépôt (`.gitignore`).
      #
      # Sous Linux : le conteneur tourne sous l'utilisateur `node` (uid 1000).
      # Un dossier créé par Docker à la place d'un dossier absent appartiendrait
      # à root, et /admin ne pourrait plus écrire — d'où ce dossier versionné,
      # et le conseil de créer le sien (`mkdir config`) si vous partez du README.
      - ./config:/config

    # ── Comptes utilisateurs et connexion SSO (bloc **actif**) ─────────────
    #
    # Comptes gérés, et connexion par le fournisseur d'identité **fictif** du
    # service `fake-oidc` défini en bas de ce fichier. Pour revenir à
    # l'application ouverte — aucun compte, aucune base — commenter tout le
    # bloc `environment:` ci-dessous.
    #
    # ⚠️ Adapter `EASY3D_ADMIN_EMAIL` avant le tout premier démarrage : ces
    # deux variables ne servent qu'à la **création** de l'administrateur,
    # ensuite elles sont ignorées (on change le mot de passe dans
    # l'interface).
    #
    # `EASY3D_DB` est inutile ici : la base se pose à côté de `config.yml`,
    # donc dans le dossier `./config` monté juste au-dessus, et survit à la
    # recréation du conteneur.
    #
    # Les réglages `EASY3D_OIDC_*` **gagnent** sur `config.yml`, et les champs
    # correspondants apparaissent grisés dans /admin — c'est voulu : le secret
    # client n'a rien à faire dans un fichier que l'interface réécrit. Le
    # `redirect_uri` à déclarer côté fournisseur est
    # `<EASY3D_PUBLIC_URL>/api/auth/oidc/callback` (rappelé dans /admin).
    environment:
      # Comptes activés, avec l'administrateur initial.
      #
      # Ces trois variables ne servent qu'à la **première** création : dès qu'un
      # administrateur existe, elles sont ignorées (on change ensuite le mot de
      # passe dans l'interface). Pour repartir de ces comptes, supprimer
      # `config/easy3d.db`.
      #
      # L'e-mail est la clé de rattachement : le **même** que le compte
      # « admin » de `fake-oidc` (plus bas) fait ouvrir la session
      # administrateur par le SSO, au lieu de créer un second compte.
      EASY3D_AUTH: "on"
      EASY3D_ADMIN_EMAIL: admin@example.com
      EASY3D_ADMIN_USERNAME: admin
      # 8 caractères minimum (règle du backend) : « admin » est refusé.
      EASY3D_ADMIN_PASSWORD: "adminadmin"

      # SSO : l'adresse publique de l'interface — celle que le **navigateur**
      # visite, et qui construit le `redirect_uri` — puis le fournisseur
      # fictif. L'émetteur est le **nom de service** Compose : la découverte,
      # le jeton et `userinfo` sont appelés par le backend ; le navigateur, lui,
      # ne visite que la page d'autorisation, que la découverte annonce à part
      # (`PUBLIC_URL`, voir `docker/fake-oidc/server.mjs`).
      #
      # Ces quatre lignes remplacées par celles d'un vrai fournisseur
      # suffisent à l'utiliser.
      EASY3D_PUBLIC_URL: http://localhost:3100
      EASY3D_OIDC_ISSUER: http://fake-oidc:8788
      EASY3D_OIDC_CLIENT_ID: easy3d
      EASY3D_OIDC_CLIENT_SECRET: secret-idp
      # Premier login inconnu → compte créé d'office (« auto »), sans rôle.
      # Autres modes : « manual » (rattachement seulement) ou « approval ».
      EASY3D_OIDC_PROVISIONING: auto

      # Adresse du serveur MCP telle qu'on la **montre** dans Mon compte → MCP.
      # Nitro ne relaie pas `/mcp` : l'interface ne peut pas la déduire de sa
      # propre origine, et ce compose publie l'API sur 3101 (le compose livré,
      # lui, utilise 8090 — le défaut de `utils/mcp.ts`).
      NUXT_PUBLIC_HPCCAT_MCP_BASE: http://localhost:3101

    # ── Catalogue des variables (non actif) ────────────────────────────────
    #
    # Le bloc `environment:` réellement utilisé est plus haut, et vise le
    # fournisseur d'identité **fictif** (`fake-oidc`, en bas du fichier) ;
    # celui-ci garde le format attendu et l'exemple d'un vrai fournisseur,
    # pour le jour où on le remplace.
    #
    # Le mot de passe administrateur ne sert qu'à la **première** création :
    # dès qu'un administrateur existe, ces deux variables sont ignorées (le
    # mot de passe ne peut plus être écrasé — on le change dans l'interface).
    #
    # `EASY3D_DB` est inutile ici : la base se pose à côté de `config.yml`,
    # donc dans le dossier `./config` monté juste au-dessus, et survit à la
    # recréation du conteneur.
    #
    # environment:
    #   EASY3D_AUTH: "on"
    #   EASY3D_ADMIN_EMAIL: vous@exemple.fr
    #   EASY3D_ADMIN_PASSWORD: "un mot de passe de 8 caractères minimum"
    #   # Facultatif : nom d'utilisateur (défaut : la partie locale de l'e-mail).
    #   # EASY3D_ADMIN_USERNAME: remi
    #
    # Connexion OIDC (facultative, en plus du mot de passe) : ces réglages
    # **gagnent** sur `config.yml`, et les champs correspondants apparaissent
    # grisés dans /admin. Les poser ici évite de laisser un secret client dans un
    # fichier que l'interface réécrit.
    #
    # Côté fournisseur, déclarer l'adresse de retour
    # `<EASY3D_PUBLIC_URL>/api/auth/oidc/callback` (rappelée dans /admin).
    #   EASY3D_PUBLIC_URL: https://easy3d.exemple.fr
    #   EASY3D_OIDC_ISSUER: https://auth.exemple.fr/application/o/easy3d/
    #   EASY3D_OIDC_CLIENT_ID: easy3d
    #   EASY3D_OIDC_CLIENT_SECRET: "…"
    #   # Facultatif : portées demandées (défaut « openid email profile ») et ce
    #   # qui se passe à la première connexion (auto, manual ou approval).
    #   # EASY3D_OIDC_SCOPES: openid email profile
    #   # EASY3D_OIDC_PROVISIONING: auto

# Plus de volume nommé : l'ancien (`easy3d_easy3d-config`) n'est plus utilisé.
# Il peut être supprimé une fois la migration vérifiée
# (`docker volume rm easy3d_easy3d-config`), ou rétabli en remettant
# `- easy3d-config:/config` dans le service et ce bloc :
# volumes:
#   easy3d-config:

  # ── Fournisseur d'identité **fictif** (développement) ────────────────────
  #
  # Un serveur OIDC minimal (`docker/fake-oidc/server.mjs`, aucune dépendance)
  # pour exercer le SSO sans compte chez un vrai fournisseur : il annonce ses
  # adresses, accepte **n'importe quelle** connexion — aucun mot de passe n'est
  # demandé — et décrit le ou les comptes simulés de `ACCOUNTS` (un seul : on
  # entre directement ; plusieurs : une page propose lequel).
  #
  # Deux adresses pour une même instance, et c'est le point à comprendre :
  #
  #   - le **backend** l'atteint par le nom de service Compose
  #     (`http://fake-oidc:8788`) : c'est là qu'il lit la découverte, échange le
  #     code et demande `userinfo` ;
  #   - le **navigateur** l'atteint par le port publié (`localhost:8788`), pour
  #     la seule page d'autorisation. La découverte annonce donc cette adresse
  #     à part (`PUBLIC_URL`), sans quoi le navigateur ne saurait pas résoudre
  #     `fake-oidc`.
  #
  # ⚠️ Développement uniquement : ne jamais exposer ce service au-delà de la
  # machine, et ne pas s'en servir comme modèle d'un vrai fournisseur.
  #
  # Journal du flux (autorisation, jeton, userinfo) :
  #   docker compose logs -f fake-oidc
  fake-oidc:
    image: node:22-alpine
    container_name: easy3d-fake-oidc
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    ports:
      - "8788:8788" # page d'autorisation, vue par le navigateur
    volumes:
      # Monté en lecture seule : le serveur tourne dans l'image, le script
      # reste sur l'hôte — une correction se teste par un simple redémarrage.
      - ./docker/fake-oidc:/app:ro
    environment:
      PORT: "8788"
      # Base vue par le navigateur. Adapter si l'interface n'est pas ouverte
      # sur `localhost` (par exemple via une IP de la machine).
      PUBLIC_URL: http://localhost:8788
      # Doivent correspondre à `EASY3D_OIDC_CLIENT_ID` / `_SECRET` plus haut.
      CLIENT_ID: easy3d
      CLIENT_SECRET: secret-idp
      # Les comptes simulés, tels que `userinfo` les décrira. L'e-mail est la
      # clé de rattachement : celui du compte « admin » correspond à
      # `EASY3D_ADMIN_EMAIL` (plus haut) → la connexion SSO **rattache** cet
      # administrateur ; tout autre e-mail crée un compte de plus, avec le rôle
      # par défaut. Au-delà d'un compte, `/authorize` affiche une page de choix.
      ACCOUNTS: '[{"id":"admin","sub":"fake-oidc-admin","email":"admin@example.com","username":"admin","name":"Administrateur (SSO fictif)"},{"id":"user","sub":"fake-oidc-user","email":"user@example.com","username":"user","name":"Utilisateur (SSO fictif)"}]'
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Banc de charge k6 (profil `loadtest`, jamais lancé par défaut) ────────
  #
  # Les scénarios sont dans `docker/k6/` — voir `docker/k6/README.md`. Ils
  # attaquent l'**API** depuis le réseau Compose (`http://easy3d:8090`), sans
  # passer ni par la machine hôte ni par le proxy Nitro.
  #
  #   docker compose --profile loadtest run --rm k6 run /scripts/smoke.js
  #   docker compose --profile loadtest run --rm k6 run /scripts/load.js
  #   docker compose --profile loadtest run --rm k6 run /scripts/ws.js
  #
  # `run` exécute k6 puis supprime le conteneur (`--rm`). Rien ne survit à un
  # test.
  #
  # ⚠️ **Pas de `depends_on`** : il ferait démarrer (donc, avec
  # `pull_policy: build` sur `easy3d`, **reconstruire et redémarrer**) le
  # serveur qu'on s'apprête à mesurer. L'application doit tourner avant :
  # `docker compose up -d`. Sinon le premier appel échoue tout de suite en
  # disant que `/auth/me` est injoignable.
  #
  # Le **profil** est la clé : `docker compose up` continue de ne lancer que
  # l'application. Un banc de charge ne doit jamais pouvoir démarrer par
  # accident sur une machine utilisée pour autre chose.
  k6:
    # Version épinglée : un changement de version peut changer les unités ou les
    # seuils, donc fausser une comparaison avant/après.
    image: grafana/k6:2.3.0
    profiles: ["loadtest"]
    volumes:
      # Lecture seule : les scénarios sont des sources, relues à chaque
      # lancement — aucune image à reconstruire quand on en modifie un.
      - ./docker/k6:/scripts:ro
    ports:
      # Tableau de bord web de k6 : courbes en direct pendant le test
      # (http://localhost:5665), plus lisibles que le résumé de fin.
      #
      # ⚠️ `docker compose run` ne publie **pas** les ports par défaut : il faut
      # ajouter `--service-ports` à la commande (voir `docker/k6/README.md`).
      - "5665:5665"
    environment:
      # Nom de service Compose : vu de ce conteneur, la machine hôte s'appelle
      # `host.docker.internal` (son `localhost` est le conteneur k6 lui-même).
      BASE_URL: http://easy3d:8090
      # Le tableau de bord est armé par défaut (c'est la façon la plus simple de
      # suivre un test). Le couper pour une mesure « propre » :
      # `-e K6_WEB_DASHBOARD=false`.
      K6_WEB_DASHBOARD: "true"
      # Sans ça, le tableau de bord n'écoute que sur la boucle locale du
      # conteneur, où le port publié ne mène pas.
      K6_WEB_DASHBOARD_HOST: "0.0.0.0"
      # Compte utilisé par les scénarios quand `EASY3D_AUTH` est actif. La
      # référence reste le bloc `environment:` du service `easy3d` ; ce sont des
      # identifiants de développement, surchargeables au lancement
      # (`EASY3D_PASSWORD=… docker compose --profile loadtest run …`).
      EASY3D_LOGIN: admin
      EASY3D_PASSWORD: "adminadmin"
    # Scénario par défaut. `run` remplace ces arguments :
    #   docker compose --profile loadtest run --rm k6 run /scripts/load.js
    command: ["run", "/scripts/smoke.js"]
