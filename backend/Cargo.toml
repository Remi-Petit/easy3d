[package]
name = "easy3d"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[dependencies]
time = "0.3.55"
regex = "1.13.1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = "2"
roxmltree = "0.20"
yrs = { version = "0.27.4", features = ["sync"] }
rmcp = { version = "3.4.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"

[profile.dev]
debug = "line-tables-only"
# codegen-backend = "cranelift"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true


# cargo upgrade --incompatible