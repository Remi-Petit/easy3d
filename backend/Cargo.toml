[package]
name = "easy3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
time = "0.3.55"
regex = "1.13.1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev]
debug = "line-tables-only"
# codegen-backend = "cranelift"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true


# cargo upgrade --incompatible