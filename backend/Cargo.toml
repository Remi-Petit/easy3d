[package]
name = "easy3d"
version = "0.4.4"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[dependencies]
time = "0.3.55"
regex = "1.13.1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 3MF = archive ZIP. Version 9 exigée par RustSec : les 2.x portent quatre
# avis (dont un critique, RUSTSEC-2026-0369) sur `extract()`, corrigés en 9.0.
zip = "9"
roxmltree = "0.20"
yrs = { version = "0.27.4", features = ["sync"] }
rmcp = { version = "3.4.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.2"
# Client HTTP des fournisseurs de modèle : TLS en Rust (pas d'OpenSSL dans
# l'image), JSON intégré.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.6.0"
uuid = { version = "1.26.1", features = ["v4", "v7"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Empreinte des jetons d'API : un hachage **rapide** suffit (le jeton est un
# secret de 32 octets tiré au hasard, il n'y a pas de dictionnaire à craindre),
# et blake2 est déjà compilé comme dépendance d'argon2.
blake2 = "0.11"
# Appel du service MCP d'un compte depuis un handler (voir `api::mcp`) :
# `ServiceExt::oneshot`. `tower` est déjà une dépendance d'axum.
tower = { version = "0.5", features = ["util"] }

# `malloc_trim` (entretien de la mémoire, voir `maintenance`) : la glibc de
# l'image Docker est la seule à exposer cet appel. Déjà compilé en transitif par
# `tokio`, on ne l'ajoute ici que pour pouvoir le nommer.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tokio-tungstenite = "0.24"
# Bancs de performance (`cargo bench`) : ils mesurent du **temps**, là où les
# tests vérifient un résultat. Voir `benches/` et `docker/k6/` (charge réelle).
criterion = "0.8"

# Un fichier de banc = un binaire indépendant.
#   cargo bench --bench formats      # rendu, PNG, aperçus complets
#   cargo bench --bench catalogue    # scan + JSON de `/models`
#   cargo bench --bench auth         # contrôle d'accès par requête
[[bench]]
name = "formats"
harness = false

[[bench]]
name = "catalogue"
harness = false

[[bench]]
name = "auth"
harness = false

[profile.dev]
debug = "line-tables-only"
# codegen-backend = "cranelift"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true


