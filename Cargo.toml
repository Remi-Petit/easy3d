[package]
name = "easy3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
time = "0.1.12"
regex = "0.1.41"

[profile.dev]
debug = "line-tables-only"
codegen-backend = "cranelift"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[build]
rustflags = "-Zthreads=8"